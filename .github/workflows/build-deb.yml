name: build-deb

# 多架构 deb 构建：amd64 / arm64 / loong64
# 方案：debootstrap deepin beige rootfs + chroot 构建
#   - amd64 / arm64: GitHub 原生 runner（ubuntu-24.04 / ubuntu-24.04-arm）
#   - loong64: x86_64 runner + qemu-user-static 模拟（GitHub 无 loong64 runner）

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: loong64
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-arch bootstrap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static

      # ============ rootfs 缓存复用（deepin beige 源稳定，rootfs 长期有效）============
      # 命中则跳过 debootstrap + apt install（最耗时步骤），直接解压复用
      - name: Restore rootfs cache (${{ matrix.arch }})
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: /tmp/rootfs-cache-${{ matrix.arch }}.tar.gz
          key: deepin-rootfs-${{ matrix.arch }}-beige-v2

      # dev 分支只构建 amd64：非 amd64 架构跳过构建步骤（省存储/额度），master/tag 全量
      - name: Restore rootfs from cache
        if: ${{ !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') && steps.rootfs-cache.outputs.cache-hit == 'true' }}
        run: |
          sudo mkdir -p /tmp/rootfs
          sudo tar xzf /tmp/rootfs-cache-${{ matrix.arch }}.tar.gz -C /tmp/rootfs
          # qemu 静态二进制在宿主侧（缓存 rootfs 不含），恢复后重新复制
          if [ "${{ matrix.arch }}" = "loong64" ]; then
            sudo cp /usr/bin/qemu-loongarch64-static /tmp/rootfs/usr/bin/
          fi
          echo "✅ rootfs 缓存命中（跳过 debootstrap + apt install）"

      - name: Bootstrap deepin beige rootfs (${{ matrix.arch }})
        if: ${{ !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') && steps.rootfs-cache.outputs.cache-hit != 'true' }}
        run: |
          # deepin 不在 debootstrap 官方脚本里，用 sid 脚本代替（beige 基于 Debian 12）
          sudo cp /usr/share/debootstrap/scripts/sid /usr/share/debootstrap/scripts/beige
          if [ "${{ matrix.arch }}" = "loong64" ]; then
            # 非本机架构：--foreign 二阶段 + qemu 用户态模拟
            sudo debootstrap --arch=loong64 --foreign --no-check-gpg --variant=minbase \
              beige /tmp/rootfs https://community-packages.deepin.com/beige
            sudo cp /usr/bin/qemu-loongarch64-static /tmp/rootfs/usr/bin/
            sudo chroot /tmp/rootfs /debootstrap/debootstrap --second-stage
          else
            sudo debootstrap --arch=${{ matrix.arch }} --no-check-gpg --variant=minbase \
              beige /tmp/rootfs https://community-packages.deepin.com/beige
          fi

      - name: Configure apt sources + install build deps
        if: ${{ !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') && steps.rootfs-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo tee /tmp/rootfs/etc/apt/sources.list > /dev/null <<'EOF'
          deb https://community-packages.deepin.com/beige beige main community
          EOF
          sudo chroot /tmp/rootfs apt-get update
          sudo chroot /tmp/rootfs env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential dpkg-dev cmake git python3 \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev linguist-qt6 \
            libdtk6core-dev libdtk6gui-dev dde-control-center-dev

      - name: Save rootfs cache (${{ matrix.arch }})
        if: ${{ !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') && steps.rootfs-cache.outputs.cache-hit != 'true' }}
        run: |
          # 压缩缓存（含已装构建依赖），下次直接复用
          sudo tar czf /tmp/rootfs-cache-${{ matrix.arch }}.tar.gz -C /tmp/rootfs .
          ls -lh /tmp/rootfs-cache-${{ matrix.arch }}.tar.gz

      - name: Copy source + build plugin
        if: ${{ !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') }}
        run: |
          sudo mkdir -p /tmp/rootfs/src
          sudo cp -a . /tmp/rootfs/src/
          # 排除本机 build 残留（避免污染 chroot 构建）
          sudo rm -rf /tmp/rootfs/src/build
          sudo chroot /tmp/rootfs bash -c \
            'cd /src && mkdir -p build && cd build && \
             cmake ../src/plugin -DCMAKE_INSTALL_PREFIX=/usr \
               -DDDE_CONTROL_CENTER_PLUGIN_DIR=plugins_v1.1 \
               -DDDE_CONTROL_CENTER_PLUGIN_INSTALL_DIR=/usr/lib/x86_64-linux-gnu/dde-control-center/plugins_v1.1 \
               -DDDE_CONTROL_CENTER_TRANSLATION_INSTALL_DIR=/usr/share/dde-control-center/translations/v1.1 \
               2>&1 | tee /tmp/cmake.log && \
             make -j$(nproc) 2>&1 | tee /tmp/make.log && \
             make install DESTDIR=/tmp/inst 2>&1 | tee /tmp/install.log'
          # 失败时输出关键日志（GitHub 日志页可见）
          sudo bash -c 'test -f /tmp/rootfs/tmp/make.log && grep -iE "error|fatal" /tmp/rootfs/tmp/make.log | tail -20 || true'
          # 确认 DESTDIR 产物
          sudo find /tmp/rootfs/tmp/inst -name '*.so' 2>/dev/null | head -5 || true

      - name: Package deb
        if: ${{ !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') }}
        run: |
          # 版本号：tag 触发用 tag 名（去 v 前缀）；分支触发从源码 kPluginVersion 自动读取
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in
            0.*|1.*|2.*) ;;  # 形如 0.8.3 的 tag
            *) VER=$(grep -oP 'kPluginVersion = QStringLiteral\("\K[^"]+' src/plugin/operation/pdfprintermodule.cpp | head -1) ;;
          esac
          echo "构建版本: $VER"
          set -x
          sudo chroot /tmp/rootfs bash -x -c "cd /src && bash ci/package-deb.sh ${{ matrix.arch }} $VER" \
            2>&1 | tee /tmp/pkg.log || true
          echo "=== pkg.log tail ==="
          tail -40 /tmp/pkg.log
          # 无论成败都把日志拷进 artifact 路径（失败也上传供分析）
          sudo cp /tmp/pkg.log /tmp/rootfs/src/ci-pkg.log || true
          ls -la /tmp/rootfs/src/dde-pdf-printer_*.deb 2>/dev/null || exit 1

      - name: Upload artifacts (always)
        if: ${{ always() && !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') }}
        uses: actions/upload-artifact@v4
        with:
          name: pkg-output-${{ matrix.arch }}
          path: |
            /tmp/rootfs/src/dde-pdf-printer_*.deb
            /tmp/rootfs/src/ci-pkg.log

      - name: Sanity check deb contents
        if: ${{ !(github.ref == 'refs/heads/dev' && matrix.arch != 'amd64') }}
        run: |
          DEB=$(ls /tmp/rootfs/src/dde-pdf-printer_*_${{ matrix.arch }}.deb | head -1)
          echo "=== $DEB ==="
          dpkg-deb --info "$DEB" | grep -E 'Package|Version|Architecture'
          dpkg-deb --contents "$DEB" | grep -E '\.so|backend|\.dci' | head -6

  # ============ tag 触发：构建成功后自动发布 Release ============
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all arch debs
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List collected debs
        run: |
          find dist -name '*.deb' | sort

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          DEBS=$(find dist -name 'dde-pdf-printer_*.deb' | sort)
          echo "发布 $TAG 资产："
          echo "$DEBS"
          NOTES="多架构安装包（GitHub Actions 自动构建）

          * amd64 / arm64 / loong64 三个 .deb
          * 构建方式：debootstrap deepin beige rootfs + chroot（loong64 经 QEMU 用户态模拟）
          * 安装：sudo apt install ./dde-pdf-printer_<版本>_<架构>.deb"
          # 确保 release 存在（已存在则复用）
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "创建 Release $TAG"
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
          # 上传 deb（先删同名旧资产，再 POST uploads——gh --clobber 有 404 bug，手动实现）
          REL_ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id')
          UPURL=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.upload_url' | sed 's/{?name,label}//')
          echo "release id=$REL_ID"
          for deb in $DEBS; do
            NAME=$(basename "$deb")
            # 1. 删除同名旧资产（GET releases/{id}/assets → DELETE assets/{id}）
            gh api "repos/$REPO/releases/$REL_ID/assets" --paginate \
              --jq '.[] | select(.name == "'"$NAME"'") | .id' 2>/dev/null | while read -r AID; do
              echo "删除旧资产 $NAME (id=$AID)"
              gh api -X DELETE "repos/$REPO/releases/assets/$AID" >/dev/null 2>&1 || true
            done
            # 2. 上传
            echo "上传 $NAME"
            gh api -X POST "$UPURL?name=$NAME" -H "Content-Type: application/vnd.debian.binary-package" \
              --input "$deb" >/dev/null || { echo "FAIL 上传 $NAME"; exit 1; }
          done
          # 验证
          gh release view "$TAG" --json tagName,assets \
            --jq '.tagName + " | assets: " + ([.assets[].name] | join(", "))'
