<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Printer body: dark teal-grey, matches DDE bloom palette -->
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4C6775"/>
      <stop offset="100%" stop-color="#2E4551"/>
    </linearGradient>
    <!-- Output tray: darker -->
    <linearGradient id="trayGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C2D35"/>
      <stop offset="100%" stop-color="#101C22"/>
    </linearGradient>
    <!-- Paper sheet -->
    <linearGradient id="paperGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EDF2"/>
    </linearGradient>
    <!-- Soft drop shadow under the printer -->
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <!-- Subtle shadow under top paper -->
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ============ Printer body ============ -->
  <g filter="url(#shadow)">
    <!-- Main body (rounded rect x30..226 y78..224) -->
    <rect x="30" y="78" width="196" height="146" rx="14" fill="url(#bodyGrad)"/>
    <!-- Top edge highlight -->
    <rect x="36" y="80" width="184" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.14"/>
    <!-- Paper feed slot opening -->
    <rect x="70" y="72" width="116" height="14" rx="5" fill="#142129"/>
    <!-- Front panel separator line -->
    <rect x="30" y="168" width="196" height="3" fill="#000000" fill-opacity="0.18"/>

    <!-- Output tray -->
    <rect x="48" y="170" width="160" height="54" rx="10" fill="url(#trayGrad)"/>
    <!-- Tray slot opening -->
    <rect x="76" y="170" width="104" height="8" rx="3" fill="#0B1418"/>
    <!-- Output paper sliding out of tray -->
    <rect x="102" y="176" width="52" height="22" rx="2" fill="url(#paperGrad)"/>
    <!-- Output paper text lines (hint of printed content) -->
    <rect x="108" y="182" width="40" height="3" rx="1.5" fill="#9DB4C0"/>
    <rect x="108" y="189" width="28" height="3" rx="1.5" fill="#B8C9D2"/>

    <!-- Status LEDs (red / blue / yellow), bloom style -->
    <rect x="198" y="102" width="18" height="7" rx="3.5" fill="#CC584C"/>
    <rect x="198" y="115" width="18" height="7" rx="3.5" fill="#1FABFF"/>
    <rect x="198" y="128" width="18" height="7" rx="3.5" fill="#F7C65C"/>
  </g>

  <!-- ============ Paper with PDF label (top feed) ============ -->
  <g filter="url(#paperShadow)">
    <!-- Paper sheet -->
    <rect x="88" y="24" width="80" height="56" rx="5" fill="url(#paperGrad)"/>
    <!-- PDF text in classic PDF red -->
    <text x="128" y="60" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#D92B1F">PDF</text>
    <!-- Blue accent bar echoing the PDF logo -->
    <rect x="109" y="66" width="38" height="5" rx="2.5" fill="#2F6FB2"/>
  </g>
</svg>
